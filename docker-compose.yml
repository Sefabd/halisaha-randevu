version: '3.8'

services:
  # PHP Apache Web Service
  web:
    build: .
    container_name: sahanet_web
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: halisaha_db
      DB_USER: root
      DB_PASS: root
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: sahanet_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: halisaha_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
